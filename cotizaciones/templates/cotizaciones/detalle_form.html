{% extends "eventos/base.html" %}

{% block titulo %}Editar detalle de cotización{% endblock %}

{% block contenido %}
<h1 class="h3 mb-4">Editar {% if tipo == 'servicio' %}servicio{% else %}implemento{% endif %} de la cotización</h1>

<form method="post" class="card card-body">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">Guardar cambios</button>
    <a href="{% url 'responder_solicitud' solicitud.pk %}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
