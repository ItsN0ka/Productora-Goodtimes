{% extends "eventos/base.html" %}

{% block titulo %}Editar implemento{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h3">Editar implemento del evento</h1>
        <p>
          Evento: <strong>{{ evento.nombre }}</strong><br>
          Implemento: <strong>{{ uso.implemento.nombre }}</strong>
        </p>

        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary">Guardar cambios</button>
          <a href="{% url 'detalle_eventos' evento.pk %}" class="btn btn-outline-secondary">
            Cancelar
          </a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
