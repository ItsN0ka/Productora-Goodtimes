{% extends "eventos/base.html" %}

{% block titulo %}Feedback del trabajador{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h3">Feedback del trabajador</h1>

                <p>
                    Trabajador: <strong>{{ participacion.trabajador.username }}</strong><br>
                    Evento: <strong>{{ evento.nombre }}</strong>
                </p>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <button type="submit" class="btn btn-primary">
                        Guardar feedback
                    </button>

                    <a
                        href="{% url 'detalle_eventos' evento.pk %}"
                        class="btn btn-outline-secondary"
                    >
                        Cancelar
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
