{% extends "eventos/base.html" %}

{% block titulo %}Eliminar evento{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card border-danger shadow-sm">
            <div class="card-body">
                <h1 class="h3 text-danger">Eliminar evento</h1>

                <p>
                    ¿Seguro que quieres eliminar
                    <strong>{{ evento.nombre }}</strong>?
                </p>

                <form method="post">
                    {% csrf_token %}

                    <button type="submit" class="btn btn-danger">
                        Sí, eliminar
                    </button>
                    <a href="{% url 'detalle_eventos' evento.pk %}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
